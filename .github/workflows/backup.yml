# สำรองฐานข้อมูลนอก Cloudflare ทุกคืน 03:00 (เวลาไทย) เก็บเป็น artifact ส่วนตัวของ repo นี้ 30 วัน
# ต้องตั้ง secrets ของ repo ก่อน (Settings › Secrets and variables › Actions):
#   CLOUDFLARE_API_TOKEN  (สิทธิ์ Account › D1 › Read)   CLOUDFLARE_ACCOUNT_ID
# ถ้ายังไม่ได้ตั้ง งานนี้จะข้ามไปเฉย ๆ (ไม่ error) — การสำรองในระบบทุกวันยังทำงานตามปกติ
name: backup
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
jobs:
  d1-export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: check secrets
        id: chk
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: 22
      - name: export D1
        if: steps.chk.outputs.ok == 'true'
        run: npx --yes wrangler@4 d1 export kanuengthueng --remote --output backup-$(date -u +%F).sql
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          name: kanuengthueng-d1-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30

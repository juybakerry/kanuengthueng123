# คะนึงถึง ห้วยกุ๊บกั๊บ โฮมสเตย์ — Worker ตัวเดียวเสิร์ฟทั้งแอป (dist/) และ API (/api/*)
name = "kanuengthueng"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kanuengthueng"
database_id = "f7f9e211-e90a-4c7d-8b00-6b9b00c8a462"
migrations_dir = "migrations"

# ทุกชั่วโมง: สรุป 09:00 / 18:00 (เวลาไทย ตั้งได้ในแอป), สำรองข้อมูล 03:00
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[vars]
APP_URL = "https://kanuengthueng.juybakerry.workers.dev"
VAPID_PUBLIC_KEY = "BEvcm2Rt637ts4-5CduzpuaVAXYmj9TvicvKmM4MpYBJ1_XAWWBCMpyR1JqCTc4ounmP60Y-uKhk-YP6XNUV-3I"
VAPID_SUBJECT = "https://kanuengthueng.juybakerry.workers.dev"
TURNSTILE_SITE_KEY = ""

# ค่าลับตั้งด้วย `wrangler secret put` (ห้ามใส่ในไฟล์นี้):
#   VAPID_PRIVATE_KEY, ADMIN_TOKEN
#   (ไม่บังคับ) LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN, TURNSTILE_SECRET
